<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>SGEANet 语音合成系统</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --accent: #e74c3c;
        }

        body {
            font-family: 'Segoe UI', system-ui;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .section-container {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin: 30px 0;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }

        .emotion-group {
            margin-bottom: 40px;
        }

        .emotion-header {
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .emotion-label {
            color: #3498db;
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .script-text {
            color: #2c3e50;
            font-size: 1em;
            font-style: italic;
        }

        .model-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .model-card {
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 15px;
            transition: transform 0.2s;
        }

        .model-card:hover {
            transform: translateY(-3px);
        }

        .model-name {
            color: #e74c3c;
            margin: 10px 0;
            font-weight: 500;
        }

        .spectrogram-box {
            margin-top: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
        }

        audio {
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>SGEANet：Interpretable and Controllable Emotional Speech Synthesis via Emotion Basis Vectors</h1>

    <script>
    // 自动生成配置（模拟文件系统扫描）
    const virtualFS = [
        // 强度控制样本 (0014angry)
        {
        "path": "0014angry/Hold up my chin, slow and solid",
        "files": [
            "0.wav",
            "1.wav",
            "2.wav"
        ],
        "type": "intensity",
        "baseEmotion": "angry"
    },
    {
        "path": "0017angry/Let's make the noise a snake",
        "files": [
            "0.wav",
            "1.wav",
            "2.wav"
        ],
        "type": "intensity",
        "baseEmotion": "angry"
    },
    {
        "path": "0015angry1/She may mind ye of her",
        "files": [
            "0.wav",
            "1.wav",
            "2.wav"
        ],
        "type": "intensity",
        "baseEmotion": "angry"
    },
    {
        "path": "0015angry2/Our thanks to gods oath",
        "files": [
            "0.wav",
            "1.wav",
            "2.wav"
        ],
        "type": "intensity",
        "baseEmotion": "angry"
    },
    {
        "path": "0013sad/Then we all say aha!",
        "files": [
            "0.wav",
            "1.wav",
            "2.wav"
        ],
        "type": "intensity",
        "baseEmotion": "sad"
    },
    {
        "path": "0019sad/I think it'll encourage me",
        "files": [
            "0.wav",
            "1.wav",
            "2.wav"
        ],
        "type": "intensity",
        "baseEmotion": "sad"
    },
     {
        "path": "0011happy/As rich as peters son in law!",
        "files": [
            "0.wav",
            "1.wav",
            "2.wav"
        ],
        "type": "intensity",
        "baseEmotion": "happy"
    },
    {
        "path": "0013happy/She is now choosing skirt to wear",
        "files": [
            "0.wav",
            "1.wav",
            "2.wav"
        ],
        "type": "intensity",
        "baseEmotion": "happy"
    },
    {
        "path": "0018happy/Take courage all isn't lost yet.",
        "files": [
            "0.wav",
            "1.wav",
            "2.wav"
        ],
        "type": "intensity",
        "baseEmotion": "happy"
    },
    {
        "path": "0019happy/I think it'll encourage me",
        "files": [
            "0.wav",
            "1.wav",
            "2.wav"
        ],
        "type": "intensity",
        "baseEmotion": "happy"
    },
    {
        "path": "0011surprise/Rat came and replied on the leaves",
        "files": [
            "0.wav",
            "1.wav",
            "2.wav"
        ],
        "type": "intensity",
        "baseEmotion": "surprise"
    },
    {
        "path": "0012surprise/Then we all say aha!",
        "files": [
            "0.wav",
            "1.wav",
            "2.wav"
        ],
        "type": "intensity",
        "baseEmotion": "surprise"
    },
    {
        "path": "0013surprise/As rich as peters son in law!",
        "files": [
            "0.wav",
            "1.wav",
            "2.wav"
        ],
        "type": "intensity",
        "baseEmotion": "surprise"
    }
    ,
    {
        "path": "happy_mixed_sad/I think it'll encourage me",
        "files": [
            "0_4.wav",
            "0.8.wav",
            "1.2.wav",
            "1.6.wav",
        ],
        "type": "",
        "baseEmotion": "happy_mixed_sad"
    },
    ];

    // 情感映射字典（修正拼写错误）
    const emotionMap = {
        "pad": "sad",
        "hap": "happy",
        "surprise": "surprise",
        "angry": "angry"
    };

    // 配置生成器
    function generateDemoConfig() {
        return {
            intensity: {
                title: "🗣️ Emotional intensity control",
                groups: virtualFS
                    .filter(f => f.type === "intensity")
                    .map(folder => {
                        const emotion = emotionMap[folder.baseEmotion] || folder.baseEmotion;
                        return {
                            emotion: `${emotion}`,
                            script: folder.path.split('/')[1].replace(/_/g, ' '),
                            folder: folder.path,
                            levels: [
                                { name: "0.wav", label: "weak" },
                                { name: "1.wav", label: "medium" },
                                { name: "2.wav", label: "strong" }
                            ],
                            spectrogram: folder.files.find(f => f.startsWith('pitch'))
                        }
                    })
            },
            blending: {
                title: "🎭 Mixed Emotion Synthesis",
                groups: virtualFS
                    .filter(f => f.type === "blending")
                    .map(folder => {
                        const [e1, e2] = folder.emotions.map(e => emotionMap[e] || e);
                        return {
                            emotion: `${e1}与${e2}混合`,
                            script: folder.path.split('/')[1].replace(/_/g, ' '),
                            folder: folder.path,
                            mixes: folder.files
                                .filter(f => f.startsWith('blend'))
                                .map(f => {
                                    const ratios = f.match(/\d+/g);
                                    return {
                                        name: f,
                                        ratio: `${e1} ${ratios[0]}% + ${e2} ${ratios[1]}%`
                                    }
                                }),
                            spectrogram: folder.files.find(f => f.startsWith('pitch'))
                        }
                    })
            }
        };
    }

    // 动态创建模块
    function createSection(config) {
        return `
            <div class="section-container">
                <h2>${config.title}</h2>
                ${config.groups.map(group => `
                    <div class="emotion-group">
                        <div class="emotion-header">
                            <div class="emotion-label">${group.emotion}</div>
                            <div class="script-text">"${group.script.replace('pets ers', 'peters')}"</div>
                        </div>

                        <div class="model-grid">
                            ${(group.levels || []).map(level => `
                                <div class="model-card">
                                    <div class="model-name">${level.label}</div>
                                    <audio controls>
                                        <source src="${group.folder}/${level.name}">
                                    </audio>
                                </div>
                            `).join('')}

                            ${(group.mixes || []).map(mix => `
                                <div class="model-card">
                                    <div class="model-name">${mix.ratio}</div>
                                    <audio controls>
                                        <source src="${group.folder}/${mix.name}">
                                    </audio>
                                </div>
                            `).join('')}
                        </div>

                        ${group.spectrogram ? `
                            <div class="spectrogram-box">
                                <h3>Pitch visualization</h3>
                                <img src="${group.folder}/${group.spectrogram}"
                                     alt="${group.emotion}"
                                     style="width:100%;max-width:800px">
                            </div>
                        ` : ''}
                    </div>
                `).join('')}
            </div>
        `;
    }

    // 渲染页面
    const config = generateDemoConfig();
    document.body.innerHTML += createSection(config.intensity);
    document.body.innerHTML += createSection(config.blending);
    </script>
</body>
</html>
